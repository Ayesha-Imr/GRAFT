# graft-monitors Phase 1 step 3: object_qa_respmon.yaml with the keyword monitor replaced by a
# decision-model monitor (monitors.registry via rh_detectors.decision_monitor). Ground-truth
# hack channels (hack_freq_*) are unchanged, so routing quality can be read off them.
name: object_qa_gm_decision
reward:
  components:
  - name: qa_correct
    role: retain
    scale: 1.0
  - name: sycophancy_continuous
    role: forget
    scale: 1.0
    params:
      per_word: 0.1
      max_reward: 0.3
      words: &id001
      - indeed
      - actually
      - exactly
      - quite
rh_detector:
  name: decision_monitor
  params:
    config_path: /workspace/code/configs/monitor/toy_intensifier.yaml
    cache_path: /workspace/cache/monitor_toy.sqlite
    prompt_mode: decoded
hack_freq_detector:
  name: sycophancy_any
  params:
    words: *id001
extra_hack_freq_detectors:
- name: sycophancy_words_excluding
  key: hack_freq_detectable
  params:
    words:
    - actually
    - exactly
    - quite
    exclude: []
- name: sycophancy_words_excluding
  key: hack_freq_undetectable
  params:
    words:
    - indeed
    exclude:
    - actually
    - exactly
    - quite
training:
  routing_mode: none
  environment: object_qa
  model: HuggingFaceTB/SmolLM2-135M-Instruct
  max_completion_length: 16
